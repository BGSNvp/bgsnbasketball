<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGSN Basketball – Clock Cam</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 700 18px Arial, sans-serif; padding: 8px; }
  h1 { font-size: 20px; margin: 0 0 6px; color: #00e5ff; }
  .box { border: 2px solid #00e5ff; border-radius: 10px; padding: 8px; margin-bottom: 8px; box-shadow: 0 0 10px #00e5ff66; }
  .lbl { color: #ffd54a; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  select, button { font: 700 20px Arial, sans-serif; padding: 10px; border-radius: 8px; border: 2px solid #fff; background: #111; color: #fff; }
  .ctl { display: flex; gap: 8px; margin-top: 6px; } .ctl select { flex: 1.3; min-width: 0; } .ctl button { flex: 1; }
  button.sm { font-size: 15px; padding: 6px 10px; }
  #go { background: #0a7d2c; } #go.stop { background: #a31515; }
  #status { font-size: 17px; }
  .note { font-weight: 400; font-size: 15px; }
  /* Sized so controls, camera and preview fit one phone screen; the stage hugs the video so drag coordinates match it */
  #stage { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #preview { display: block; max-width: 100%; max-height: 32vh; background: #222; border-radius: 6px; }
  #sel { position: absolute; border: 3px solid #ffd54a; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); pointer-events: none; }
  #out { display: block; max-width: 100%; max-height: 12vh; margin: 0 auto; background: #222; }
</style>
</head>
<body>
<h1>CLOCK CAM</h1>
<div class="box">
  <div class="note">Same Wi-Fi as the YoloBox. Press START, then drag a box around the clock digits.</div>
  <div class="ctl"><select id="cam"><option value="">Back camera</option></select><button id="go">START</button></div>
</div>
<div class="box"><div id="status">Not started</div><div id="path" class="note"></div><div id="scoreSays" class="note"></div></div>
<div class="box">
  <div class="lbl">Drag a box on the clock <button id="full" class="sm">WHOLE</button></div>
  <div id="stage"><video id="preview" autoplay playsinline muted></video><div id="sel"></div></div>
</div>
<div class="box"><div class="lbl">What the scoreboard shows</div><canvas id="out" width="320" height="128"></canvas></div>

<script type="module">
import { setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { camRef as ref, subscribeCam, ICE, gathered } from './bb-clockcam.js';

const $ = id => document.getElementById(id);
const say = (t, c) => { $('status').textContent = t; $('status').style.color = c || '#fff'; };
const v = $('preview'), out = $('out'), ctx = out.getContext('2d');
const KEY = 'bbClockCrop';
let crop = null;
try { crop = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!crop || !(crop.w > 0)) crop = { x: 0, y: 0, w: 1, h: 1 };
let pc = null, cam = null, outStream = null, myTs = 0, lastWant = 0, doc = {}, statsTimer = null, wake = null, looping = false;

// ─── Crop box: drag on the picture ───
function showSel() {
  const s = $('sel').style;
  s.left = crop.x * 100 + '%'; s.top = crop.y * 100 + '%'; s.width = crop.w * 100 + '%'; s.height = crop.h * 100 + '%';
}
let drag = null;
const pt = e => { const r = $('stage').getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
$('stage').addEventListener('pointerdown', e => { drag = { start: pt(e), prev: crop }; $('stage').setPointerCapture(e.pointerId); });
$('stage').addEventListener('pointermove', e => {
  if (!drag) return;
  const [x0, y0] = drag.start, [x1, y1] = pt(e);
  crop = { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
  showSel();
});
const endDrag = () => {
  if (!drag) return;
  if (crop.w < 0.02 || crop.h < 0.02) crop = drag.prev;
  drag = null; showSel(); localStorage.setItem(KEY, JSON.stringify(crop));
};
$('stage').addEventListener('pointerup', endDrag);
$('stage').addEventListener('pointercancel', endDrag);
$('full').onclick = () => { crop = { x: 0, y: 0, w: 1, h: 1 }; showSel(); localStorage.setItem(KEY, JSON.stringify(crop)); };
showSel();

// ─── Draw only the clock area into the canvas that is sent ───
function draw() {
  if (v.videoWidth) {
    const sx = crop.x * v.videoWidth, sy = crop.y * v.videoHeight, sw = crop.w * v.videoWidth, sh = crop.h * v.videoHeight;
    let w = Math.min(640, Math.max(320, sw)), h = w * sh / sw;
    if (h > 360) { h = 360; w = h * sw / sh; }
    w = Math.max(2, Math.round(w / 2) * 2); h = Math.max(2, Math.round(h / 2) * 2);
    if (out.width !== w || out.height !== h) { out.width = w; out.height = h; }
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
  }
  next();
}
function next() { if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(draw); else requestAnimationFrame(draw); }

// ─── Connection ───
subscribeCam(x => {
  doc = x;
  if (x.status) $('scoreSays').textContent = 'Scoreboard says: ' + x.status + (x.statusAt ? ' (' + new Date(x.statusAt).toLocaleTimeString() + ')' : '');
  if (!cam) return;
  if (x.want && x.want !== lastWant) { lastWant = x.want; offer(); }
  if (pc && x.answer && x.answerTs === myTs && pc.signalingState === 'have-local-offer')
    pc.setRemoteDescription({ type: 'answer', sdp: x.answer }).catch(e => say('Answer error: ' + e.message, '#ff6b6b'));
});

async function offer() {
  if (pc) { pc.onconnectionstatechange = null; pc.close(); }
  const p = pc = new RTCPeerConnection({ iceServers: ICE });
  outStream.getTracks().forEach(t => p.addTrack(t, outStream));
  p.onconnectionstatechange = () => {
    if (p !== pc) return;
    const s = p.connectionState;
    if (s === 'connected') say('CONNECTED – sending the clock', '#4dff88');
    else if (s === 'failed' || s === 'disconnected' || s === 'closed') say('Scoreboard disconnected – it reconnects by itself', '#ff6b6b');
  };
  try {
    await p.setLocalDescription(await p.createOffer());
    await gathered(p);
    if (p !== pc) return;
    myTs = Date.now();
    await setDoc(ref, { offer: p.localDescription.sdp, offerTs: myTs }, { merge: true });
    say('Waiting for the scoreboard (Gym clock on?)…', '#ffd54a');
  } catch (e) { say('Error: ' + e.message, '#ff6b6b'); }
}

async function stats() {
  if (!pc) return;
  const st = await pc.getStats(); let pair = null, fps = null; const c = {};
  st.forEach(r => {
    if (r.type === 'outbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) fps = r.framesPerSecond;
    if (r.type === 'candidate-pair' && (r.selected || r.nominated) && r.state === 'succeeded') pair = r;
    if (r.type === 'local-candidate' || r.type === 'remote-candidate') c[r.id] = r;
  });
  $('path').textContent = pair && pc.connectionState === 'connected'
    ? 'Sending ' + out.width + '×' + out.height + (fps != null ? ' at ' + Math.round(fps) + ' fps' : '') : '';
}

async function listCams() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const sel = $('cam'), cur = sel.value;
    sel.innerHTML = '';
    sel.add(new Option('Back camera', ''));
    devs.forEach((d, i) => sel.add(new Option(d.label || 'Camera ' + (i + 1), d.deviceId)));
    sel.value = cur;
  } catch (e) {}
}

async function start() {
  try {
    say('Opening camera…');
    const id = $('cam').value;
    cam = await navigator.mediaDevices.getUserMedia({ audio: false, video: Object.assign(
      { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
      id ? { deviceId: { exact: id } } : { facingMode: { ideal: 'environment' } }) });
    v.srcObject = cam;
    if (!outStream) outStream = out.captureStream(30);
    if (!looping) { looping = true; next(); }
    listCams();
    keepAwake();
    $('go').textContent = 'STOP'; $('go').classList.add('stop');
    lastWant = doc.want || 0;
    offer();
    statsTimer = setInterval(stats, 2000);
  } catch (e) { cam = null; say('Error: ' + e.message, '#ff6b6b'); }
}

function stop() {
  clearInterval(statsTimer);
  if (pc) { pc.onconnectionstatechange = null; pc.close(); } pc = null;
  if (cam) cam.getTracks().forEach(t => t.stop()); cam = null;
  if (wake) { wake.release().catch(() => {}); wake = null; }
  $('go').textContent = 'START'; $('go').classList.remove('stop'); $('path').textContent = '';
  say('Stopped');
}

// The browser drops the screen lock whenever the page is hidden, so take it again each time it comes back.
async function keepAwake() {
  if (wake || !navigator.wakeLock) return;
  try {
    const w = await navigator.wakeLock.request('screen');
    if (!cam) { w.release().catch(() => {}); return; }
    wake = w;
    w.addEventListener('release', () => { if (wake === w) wake = null; });
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (cam && document.visibilityState === 'visible') keepAwake(); });
$('go').onclick = () => cam ? stop() : start();
listCams();
</script>
</body>
</html>
