<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BGSN Basketball Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@700;900&family=Orbitron:wght@900&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --home: #1a6fc4; --away: #c41a1a; --gold: #ffcc00; --tgold: #ffd960; --chrome-hi: #e8ecf4; --gold-glow: rgba(255,217,96,0.6); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; font-family: 'Roboto Condensed', sans-serif; color: #fff; }

  /* ESPN-style stacked corner bug, bottom-left */
  .bug { position: absolute; left: 60px; bottom: var(--bug-b, 96px); box-shadow: 0 4px 18px rgba(0,0,0,0.65); transition: opacity 0.4s; }
  .bug.hidden { opacity: 0; }
  .main { display: grid; grid-template-columns: auto 160px; }
  .rows { display: flex; flex-direction: column; gap: 2px; background: #000; }
  .row { display: flex; height: 58px; }

  /* Logo + team name share one box; each can be moved inside it */
  .away { --c: var(--away); } .home { --c: var(--home); }
  .teambox { position: relative; width: 324px; overflow: hidden; background: linear-gradient(90deg, var(--c) 0%, var(--c) 18%, #141414 100%); }
  .logo { position: absolute; left: 0; top: 0; bottom: 0; width: 64px; display: flex; align-items: center; justify-content: center; }
  .logo img { max-height: 48px; max-width: 56px; object-fit: contain;
    transform: translate(var(--x, 0px), var(--y, 0px)) scale(var(--z, 1)) scaleX(var(--f, 1)); }
  .logo img[src=''] { display: none; }

  .name { position: absolute; left: 76px; top: 0; bottom: 0; display: flex; align-items: center;
    font: 700 34px 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); transform: translate(var(--nx, 0px), var(--ny, 0px)); z-index: 1; }
  .rank { color: var(--gold); font-size: 0.6em; margin-right: 2px; }
  .poss { width: 0; height: 0; margin-left: 10px; flex: none; border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    border-right: 12px solid var(--gold); visibility: hidden; }
  .poss.on { visibility: visible; }

  .info { width: 150px; background: #141414; display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
    gap: 7px; padding-right: 10px; font: 700 15px Arial, sans-serif; color: #c8c8c8; letter-spacing: 1px; white-space: nowrap; }
  .info b { color: #fff; }
  .tos { display: flex; gap: 4px; }
  .to-dot { width: 15px; height: 5px; background: #444; }
  .to-dot.on { background: #fff; }
  .bonus { background: var(--gold); color: #111; padding: 0 5px; margin-right: 6px; display: none; }
  .bonus.on { display: inline; }

  .score { width: 84px; background: #fff; color: #111; display: flex; align-items: center; justify-content: center;
    font: 900 42px 'Roboto Condensed', sans-serif; }

  .clockbox { background: #000; border-left: 2px solid #2a2a2a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .clock { font: 900 48px 'Roboto Condensed', sans-serif; line-height: 1; }
  .clock.low { color: #ff4d4d; }
  .period { font: 700 22px 'Oswald', sans-serif; color: var(--gold); letter-spacing: 3px; }

  .sponsor { background: #0b0b0b; border-top: 2px solid var(--gold); padding: 4px 12px; font: 700 18px 'Oswald', sans-serif;
    letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sponsorName { transition: opacity 0.5s; }
  .sponsor small { color: var(--gold); font-size: 14px; margin-right: 10px; }
  .sponsor.off { display: none; }

  /* ─── Two bottom tickers (same look and controls as the football overlay) ─── */
  .ticker { --tk-h: var(--tk1-h, 38px); position: absolute; bottom: var(--tk1-off, var(--tk2-h, 38px)); left: 0; right: 0; height: var(--tk-h);
    background: linear-gradient(180deg, #131320 0%, #08080e 100%); display: flex; align-items: center; overflow: hidden;
    border-top: 2px solid; border-image: linear-gradient(90deg, rgba(60,65,80,0.5), var(--chrome-hi), var(--tgold), var(--chrome-hi), rgba(60,65,80,0.5)) 1;
    box-shadow: inset 0 2px 8px rgba(255,255,255,0.04); }
  .ticker::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 10%, var(--gold-glow) 50%, transparent 90%); box-shadow: 0 0 12px var(--gold-glow); pointer-events: none; z-index: 5; }
  .ticker::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); pointer-events: none; z-index: 5; }
  .ticker-content { flex: 1; overflow: hidden; display: flex; align-items: center; height: 100%; }
  .ticker-label { background: linear-gradient(180deg, #1e1e34 0%, #12121e 50%, #0a0a14 100%); font-family: 'Orbitron', sans-serif; font-weight: 900; font-style: italic;
    font-size: calc(var(--tk-h) * 0.474); letter-spacing: 1px; padding: 0 16px; height: 100%; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0;
    border-right: 3px solid; border-image: linear-gradient(180deg, var(--chrome-hi), var(--tgold), rgba(0,0,0,0.5)) 1; position: relative; z-index: 2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.3); }
  .ticker-label span { background: linear-gradient(180deg, #ffe88a 0%, #ffd960 25%, #c8a020 65%, #a07818 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 6px rgba(255,217,96,0.4)) drop-shadow(0 1px 1px rgba(0,0,0,0.6)); }
  .ticker-label::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 3px),
      linear-gradient(180deg, rgba(255,255,255,0.08), transparent 40%, rgba(0,0,0,0.2)); }
  .ticker-label::after { content: ''; position: absolute; top: 0; right: -3px; width: 16px; height: 100%; pointer-events: none;
    background: linear-gradient(180deg, rgba(200,168,75,0.25), transparent 30%, transparent 70%, rgba(200,168,75,0.25)); }
  .ticker-scroll { display: flex; white-space: nowrap; will-change: transform; transform: translate3d(0,0,0); backface-visibility: hidden; }
  .ticker-item { color: #e8e8e8; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: calc(var(--tk-h) * 0.737); letter-spacing: 1px; padding: 0 30px; line-height: var(--tk-h); }
  .ticker-sep { color: #ffd960; padding: 0 8px; font-size: calc(var(--tk-h) * 0.737); line-height: var(--tk-h); text-shadow: 0 0 8px rgba(255,217,96,0.5); }
  @keyframes scroll-left { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-50%,0,0); } }
  .ticker.ticker-lower { --tk-h: var(--tk2-h, 38px); bottom: 0; }
  .ticker-lower .ticker-item { color: #f0c040; }
  .ticker-lower .ticker-sep { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .ticker-lower .ticker-label span { background: none; -webkit-background-clip: initial; background-clip: initial; -webkit-text-fill-color: #fff; color: #fff;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.35)) drop-shadow(0 1px 1px rgba(0,0,0,0.6)); }
</style>
</head>
<body>
<div class="bug" id="board">
  <div class="main">
    <div class="rows">
      <div class="row away">
        <div class="teambox"><div class="logo"><img id="awayLogo" src="" alt=""></div>
        <div class="name"><span id="awayName">AWAY</span><span class="poss" id="possAway"></span></div></div>
        <div class="info"><div class="tos" id="awayTOs"></div><div><span class="bonus" id="awayBonus">BONUS</span>FOULS <b id="awayFouls">0</b></div></div>
        <div class="score" id="awayScore">0</div>
      </div>
      <div class="row home">
        <div class="teambox"><div class="logo"><img id="homeLogo" src="" alt=""></div>
        <div class="name"><span id="homeName">HOME</span><span class="poss" id="possHome"></span></div></div>
        <div class="info"><div class="tos" id="homeTOs"></div><div><span class="bonus" id="homeBonus">BONUS</span>FOULS <b id="homeFouls">0</b></div></div>
        <div class="score" id="homeScore">0</div>
      </div>
    </div>
    <div class="clockbox"><div class="clock" id="clock">8:00</div><div class="period" id="period">1ST</div></div>
  </div>
  <div class="sponsor off" id="sponsor"><small>PRESENTED BY</small><span id="sponsorName"></span></div>
</div>

<div class="ticker" id="tickerBar"><div class="ticker-label"><span>BGSN</span></div><div class="ticker-content"><div class="ticker-scroll" id="tickerScroll"></div></div></div>
<div class="ticker ticker-lower" id="ticker2Bar"><div class="ticker-label"><span id="ticker2DateTime"></span></div><div class="ticker-content"><div class="ticker-scroll" id="ticker2Scroll"></div></div></div>

<script type="module">
  import { subscribe } from './bb-store.js';
  import { withDefaults, clockRemaining, formatClock, setRankText } from './bb-common.js';

  const $ = id => document.getElementById(id);
  let data = withDefaults({});

  function dots(el, left, max) {
    el.textContent = '';
    for (let i = 0; i < max; i++) {
      const d = document.createElement('div');
      d.className = 'to-dot' + (i < left ? ' on' : '');
      el.appendChild(d);
    }
  }

  function render() {
    const d = data;
    document.documentElement.style.setProperty('--home', d.homeColor);
    document.documentElement.style.setProperty('--away', d.awayColor);
    $('board').classList.toggle('hidden', d.visible === false);
    for (const t of ['home', 'away']) {
      setRankText($(t + 'Name'), d[t + 'Name']);
      $(t + 'Score').textContent = d[t + 'Score'];
      $(t + 'Fouls').textContent = d[t + 'Fouls'];
      const img = $(t + 'Logo');
      if (img.getAttribute('src') !== (d[t + 'Logo'] || '')) img.setAttribute('src', d[t + 'Logo'] || '');
      img.style.setProperty('--z', Number(d[t + 'LogoZoom']) || 1);
      img.style.setProperty('--x', (Number(d[t + 'LogoX']) || 0) + 'px');
      img.style.setProperty('--y', (Number(d[t + 'LogoY']) || 0) + 'px');
      img.style.setProperty('--f', d[t + 'LogoFlip'] ? -1 : 1);
      const nm = $(t + 'Name').parentElement;
      nm.style.setProperty('--nx', (Number(d[t + 'NameX']) || 0) + 'px');
      nm.style.setProperty('--ny', (Number(d[t + 'NameY']) || 0) + 'px');
      const max = Math.max(0, Math.min(10, Number(d.maxTO) || 0));
      dots($(t + 'TOs'), Math.min(max, Number(d[t + 'TO']) || 0), max);
    }
    // A team is in the bonus when the OTHER team has reached the foul limit
    const at = Number(d.bonusAt) || 0;
    $('homeBonus').classList.toggle('on', at > 0 && Number(d.awayFouls) >= at);
    $('awayBonus').classList.toggle('on', at > 0 && Number(d.homeFouls) >= at);
    $('possHome').classList.toggle('on', d.poss === 'home');
    $('possAway').classList.toggle('on', d.poss === 'away');
    $('period').textContent = d.period;
    setSponsors(d.sponsor);
    renderTickers(d);
    fitNames();
    tick();
  }

  // Both team boxes are sized to the longer name so the fouls/BONUS area sits snug after it.
  // Names too long for the widest box shrink together so both rows match.
  const BOX_MIN = 180, BOX_MAX = 324, NAME_LEFT = 76, NAME_PAD = 14;
  function fitNames() {
    const boxes = [$('homeName').parentElement, $('awayName').parentElement];
    const need = () => Math.max(...boxes.map(b =>
      NAME_LEFT + Math.max(0, parseFloat(b.style.getPropertyValue('--nx')) || 0) + b.scrollWidth + NAME_PAD));
    let fs = 34;
    const apply = () => boxes.forEach(b => b.style.fontSize = fs + 'px');
    apply();
    while (need() > BOX_MAX && fs > 16) { fs -= 1; apply(); }
    const w = Math.max(BOX_MIN, Math.min(BOX_MAX, Math.ceil(need())));
    document.querySelectorAll('.teambox').forEach(tb => tb.style.width = w + 'px');
  }

  // ─── Tickers (ported from the football overlay) ───
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const splitItems = s => String(s || '').split('|').map(t => t.trim()).filter(Boolean);
  const itemsHtml = list => list.map(t => `<span class="ticker-item">${esc(t)}</span><span class="ticker-sep">&#9670;</span>`).join('');
  function fillTicker(el, items, speed, shift) {
    const sig = items.join('|');
    if (el.dataset.tickerSig === sig) { applyTickerSpeed(el, speed, shift); return; }
    el.dataset.tickerSig = sig; el.dataset.anim = '';
    if (!items.length) { el.innerHTML = ''; el.style.animation = 'none'; return; }
    // Repeat items until one set is wider than the screen, then double it for a seamless loop
    let set = [...items];
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;';
    probe.innerHTML = itemsHtml(set);
    el.parentNode.appendChild(probe);
    while (probe.scrollWidth < 1920 && set.length < items.length * 20) { set = set.concat(items); probe.innerHTML = itemsHtml(set); }
    probe.remove();
    el.innerHTML = itemsHtml([...set, ...set]);
    applyTickerSpeed(el, speed, shift);
  }
  function applyTickerSpeed(el, speed, shift) {
    requestAnimationFrame(() => {
      if (!(speed > 0)) return setStatic(el, Number(shift) || 0);
      const halfW = el.scrollWidth / 2;
      if (halfW > 0) setAnimation(el, halfW / speed, halfW);
    });
  }
  // Only restart the crawl when its duration changes, and keep the current position when it does
  function setAnimation(el, durSec, halfW) {
    const anim = `scroll-left ${durSec}s linear infinite`;
    if (el.dataset.anim === anim) return;
    let offsetPx = 0;
    try {
      const prev = el.getAnimations ? el.getAnimations()[0] : null;
      const prevHalfW = Number(el.dataset.halfW) || 0;
      if (prev && prevHalfW > 0 && prev.currentTime != null) {
        const prevDur = Number(prev.effect.getTiming().duration) / 1000;
        if (prevDur > 0) offsetPx = prevHalfW * (((Number(prev.currentTime) / 1000) % prevDur) / prevDur);
      }
    } catch (e) { offsetPx = 0; }
    el.dataset.anim = anim; el.dataset.halfW = halfW;
    el.style.transform = ''; el.style.animation = anim;
    if (offsetPx > 0) {
      try { const next = el.getAnimations()[0]; if (next) next.currentTime = Math.min(offsetPx / halfW, 1) * durSec * 1000; } catch (e) {}
    }
  }
  // Speed 0 parks the ticker at a manual left/right offset
  function setStatic(el, shiftPx) {
    const key = 'static:' + shiftPx;
    if (el.dataset.anim === key) return;
    el.dataset.anim = key; el.style.animation = 'none'; el.style.transform = 'translate3d(' + shiftPx + 'px,0,0)';
  }
  const numIn = (v, lo, hi, def) => { const n = Number(v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : def; };
  function renderTickers(d) {
    const root = document.documentElement.style;
    const h1 = numIn(d.tickerSize1, 20, 90, 38), h2 = numIn(d.tickerSize2, 20, 90, 38);
    const on1 = d.ticker1On !== false, on2 = d.ticker2On !== false;
    root.setProperty('--tk1-h', h1 + 'px'); root.setProperty('--tk2-h', h2 + 'px');
    root.setProperty('--tk1-off', on2 ? h2 + 'px' : '0px');
    $('tickerBar').style.display = on1 ? '' : 'none';
    $('ticker2Bar').style.display = on2 ? '' : 'none';
    // Scoreboard sits 20px above whichever tickers are showing
    const stack = (on1 ? h1 : 0) + (on2 ? h2 : 0);
    root.setProperty('--bug-b', (stack ? stack + 20 : 60) + 'px');
    fillTicker($('tickerScroll'), splitItems(d.ticker1), numIn(d.tickerSpeed1, 0, 120, 35), numIn(d.tickerShift1, -2000, 2000, 0));
    fillTicker($('ticker2Scroll'), splitItems(d.ticker2), numIn(d.tickerSpeed2, 0, 120, 33), numIn(d.tickerShift2, -2000, 2000, 0));
  }
  function updateDateTime() {
    const now = new Date();
    const p2 = n => String(n).padStart(2, '0');
    let h = now.getHours(); const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    $('ticker2DateTime').textContent = p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + '-' + String(now.getFullYear()).slice(-2) + ' ' + h + ':' + p2(now.getMinutes()) + ' ' + ampm;
  }
  updateDateTime(); setInterval(updateDateTime, 30000);

  // ─── Sponsor: separate with | and they take turns every 15 seconds ───
  let sponsors = [], spIdx = 0, spTimer = null;
  function setSponsors(raw) {
    const list = splitItems(raw);
    $('sponsor').classList.toggle('off', !list.length);
    if (list.join('|') === sponsors.join('|')) return;
    sponsors = list; spIdx = 0;
    const el = $('sponsorName'); el.textContent = list[0] || ''; el.style.opacity = 1;
    clearInterval(spTimer); spTimer = null;
    if (list.length > 1) spTimer = setInterval(() => {
      el.style.opacity = 0;
      setTimeout(() => { spIdx = (spIdx + 1) % sponsors.length; el.textContent = sponsors[spIdx] || ''; el.style.opacity = 1; }, 500);
    }, 15000);
  }

  function tick() {
    const ms = clockRemaining(data);
    const el = $('clock');
    const txt = formatClock(ms);
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('low', ms < 60000);
  }
  setInterval(tick, 50);

  subscribe(d => { data = withDefaults(d); render(); }, err => console.warn(err));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
  render();
</script>
</body>
</html>
