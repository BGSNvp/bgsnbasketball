<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BGSN Basketball Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --home: #1a6fc4; --away: #c41a1a; --gold: #ffcc00; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; font-family: 'Roboto Condensed', sans-serif; color: #fff; }

  /* ESPN-style stacked corner bug, bottom-left */
  .bug { position: absolute; left: 60px; bottom: 60px; box-shadow: 0 4px 18px rgba(0,0,0,0.65); transition: opacity 0.4s; }
  .bug.hidden { opacity: 0; }
  .main { display: grid; grid-template-columns: auto 160px; }
  .rows { display: flex; flex-direction: column; gap: 2px; background: #000; }
  .row { display: flex; height: 58px; }

  /* Logo + team name share one box; each can be moved inside it */
  .away { --c: var(--away); } .home { --c: var(--home); }
  .teambox { position: relative; width: 324px; overflow: hidden; background: linear-gradient(90deg, var(--c) 0%, var(--c) 18%, #141414 100%); }
  .logo { position: absolute; left: 0; top: 0; bottom: 0; width: 64px; display: flex; align-items: center; justify-content: center; }
  .logo img { max-height: 48px; max-width: 56px; object-fit: contain;
    transform: translate(var(--x, 0px), var(--y, 0px)) scale(var(--z, 1)) scaleX(var(--f, 1)); }
  .logo img[src=''] { display: none; }

  .name { position: absolute; left: 76px; right: 12px; top: 0; bottom: 0; display: flex; align-items: center;
    font: 700 34px 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); transform: translate(var(--nx, 0px), var(--ny, 0px)); z-index: 1; }
  .rank { color: var(--gold); font-size: 0.6em; margin-right: 2px; }
  .poss { width: 0; height: 0; margin-left: 10px; flex: none; border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    border-right: 12px solid var(--gold); visibility: hidden; }
  .poss.on { visibility: visible; }

  .info { width: 150px; background: #141414; display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
    gap: 7px; padding-right: 10px; font: 700 15px Arial, sans-serif; color: #c8c8c8; letter-spacing: 1px; white-space: nowrap; }
  .info b { color: #fff; }
  .tos { display: flex; gap: 4px; }
  .to-dot { width: 15px; height: 5px; background: #444; }
  .to-dot.on { background: #fff; }
  .bonus { background: var(--gold); color: #111; padding: 0 5px; margin-right: 6px; display: none; }
  .bonus.on { display: inline; }

  .score { width: 84px; background: #fff; color: #111; display: flex; align-items: center; justify-content: center;
    font: 900 42px 'Roboto Condensed', sans-serif; }

  .clockbox { background: #000; border-left: 2px solid #2a2a2a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .clock { font: 900 48px 'Roboto Condensed', sans-serif; line-height: 1; }
  .clock.low { color: #ff4d4d; }
  .period { font: 700 22px 'Oswald', sans-serif; color: var(--gold); letter-spacing: 3px; }

  .sponsor { background: #0b0b0b; border-top: 2px solid var(--gold); padding: 4px 12px; font: 700 18px 'Oswald', sans-serif;
    letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; }
  .sponsor small { color: var(--gold); font-size: 14px; margin-right: 10px; }
  .sponsor.off { display: none; }
</style>
</head>
<body>
<div class="bug" id="board">
  <div class="main">
    <div class="rows">
      <div class="row away">
        <div class="teambox"><div class="logo"><img id="awayLogo" src="" alt=""></div>
        <div class="name"><span id="awayName">AWAY</span><span class="poss" id="possAway"></span></div></div>
        <div class="info"><div class="tos" id="awayTOs"></div><div><span class="bonus" id="awayBonus">BONUS</span>FOULS <b id="awayFouls">0</b></div></div>
        <div class="score" id="awayScore">0</div>
      </div>
      <div class="row home">
        <div class="teambox"><div class="logo"><img id="homeLogo" src="" alt=""></div>
        <div class="name"><span id="homeName">HOME</span><span class="poss" id="possHome"></span></div></div>
        <div class="info"><div class="tos" id="homeTOs"></div><div><span class="bonus" id="homeBonus">BONUS</span>FOULS <b id="homeFouls">0</b></div></div>
        <div class="score" id="homeScore">0</div>
      </div>
    </div>
    <div class="clockbox"><div class="clock" id="clock">8:00</div><div class="period" id="period">1ST</div></div>
  </div>
  <div class="sponsor off" id="sponsor"><small>PRESENTED BY</small><span id="sponsorName"></span></div>
</div>

<script type="module">
  import { subscribe } from './bb-store.js';
  import { withDefaults, clockRemaining, formatClock, setRankText } from './bb-common.js';

  const $ = id => document.getElementById(id);
  let data = withDefaults({});

  function dots(el, left, max) {
    el.textContent = '';
    for (let i = 0; i < max; i++) {
      const d = document.createElement('div');
      d.className = 'to-dot' + (i < left ? ' on' : '');
      el.appendChild(d);
    }
  }

  function render() {
    const d = data;
    document.documentElement.style.setProperty('--home', d.homeColor);
    document.documentElement.style.setProperty('--away', d.awayColor);
    $('board').classList.toggle('hidden', d.visible === false);
    for (const t of ['home', 'away']) {
      setRankText($(t + 'Name'), d[t + 'Name']);
      $(t + 'Score').textContent = d[t + 'Score'];
      $(t + 'Fouls').textContent = d[t + 'Fouls'];
      const img = $(t + 'Logo');
      if (img.getAttribute('src') !== (d[t + 'Logo'] || '')) img.setAttribute('src', d[t + 'Logo'] || '');
      img.style.setProperty('--z', Number(d[t + 'LogoZoom']) || 1);
      img.style.setProperty('--x', (Number(d[t + 'LogoX']) || 0) + 'px');
      img.style.setProperty('--y', (Number(d[t + 'LogoY']) || 0) + 'px');
      img.style.setProperty('--f', d[t + 'LogoFlip'] ? -1 : 1);
      const nm = $(t + 'Name').parentElement;
      nm.style.setProperty('--nx', (Number(d[t + 'NameX']) || 0) + 'px');
      nm.style.setProperty('--ny', (Number(d[t + 'NameY']) || 0) + 'px');
      const max = Math.max(0, Math.min(10, Number(d.maxTO) || 0));
      dots($(t + 'TOs'), Math.min(max, Number(d[t + 'TO']) || 0), max);
    }
    // A team is in the bonus when the OTHER team has reached the foul limit
    const at = Number(d.bonusAt) || 0;
    $('homeBonus').classList.toggle('on', at > 0 && Number(d.awayFouls) >= at);
    $('awayBonus').classList.toggle('on', at > 0 && Number(d.homeFouls) >= at);
    $('possHome').classList.toggle('on', d.poss === 'home');
    $('possAway').classList.toggle('on', d.poss === 'away');
    $('period').textContent = d.period;
    $('sponsorName').textContent = d.sponsor || '';
    $('sponsor').classList.toggle('off', !d.sponsor);
    fitNames();
    tick();
  }

  // Shrink long names to fit; both rows shrink together so they match
  function fitNames() {
    const boxes = [$('homeName').parentElement, $('awayName').parentElement];
    let fs = 34;
    const apply = () => boxes.forEach(b => b.style.fontSize = fs + 'px');
    apply();
    while (boxes.some(b => b.scrollWidth > b.clientWidth) && fs > 16) { fs -= 1; apply(); }
  }

  function tick() {
    const ms = clockRemaining(data);
    const el = $('clock');
    const txt = formatClock(ms);
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('low', ms < 60000);
  }
  setInterval(tick, 50);

  subscribe(d => { data = withDefaults(d); render(); }, err => console.warn(err));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
  render();
</script>
</body>
</html>
