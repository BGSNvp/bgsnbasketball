<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BGSN Basketball – Camera Test (YoloBox)</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
  #info { position: absolute; left: 30px; top: 30px; right: 30px; font: 700 44px Arial, sans-serif; color: #fff;
          text-shadow: 0 0 6px #000, 0 0 6px #000; line-height: 1.3; }
  #big { font-size: 64px; }
  .ok { color: #4dff88; } .bad { color: #ff6b6b; } .wait { color: #ffd54a; }
  #ua { font: 400 22px Arial, sans-serif; color: #ccc; margin-top: 12px; }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="info">
  <div id="big" class="wait">CAMERA TEST: loading…</div>
  <div id="detail"></div>
  <div id="ua"></div>
</div>
<script>
  // Plain script (no modules) so even an old browser can report what it supports.
  var hasRTC = typeof window.RTCPeerConnection === 'function';
  document.getElementById('ua').textContent = navigator.userAgent;
  window.onerror = function (m) { document.getElementById('detail').textContent = 'Page error: ' + m; };
  if (!hasRTC) {
    var b = document.getElementById('big');
    b.textContent = 'NO: this YoloBox browser cannot receive live video (no WebRTC)';
    b.className = 'bad';
  }
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const ref = doc(getFirestore(initializeApp(firebaseConfig)), 'basketball', 'camtest');
const $ = id => document.getElementById(id);
const v = $('v');
const big = (t, c) => { $('big').textContent = t; $('big').className = c; };
const detail = t => { $('detail').textContent = t; };
let pc = null, handled = 0, reported = '', timer = null, lastFrames = 0, lastAt = 0;

function report(s) {
  if (s === reported) return;
  reported = s;
  setDoc(ref, { yoloStatus: s, yoloAt: Date.now(), yoloUA: navigator.userAgent }, { merge: true }).catch(() => {});
}

if (!window.RTCPeerConnection) {
  report('NO WebRTC in YoloBox browser');
} else {
  big('CAMERA TEST: waiting for phone – press START on the phone', 'wait');
  onSnapshot(ref, snap => {
    const d = snap.exists() ? snap.data() : {};
    if (d.offer && d.offerTs && d.offerTs !== handled) { handled = d.offerTs; answer(d.offer, d.offerTs); }
  }, e => big('Firebase error: ' + e.message, 'bad'));
}

function gathered(p) {
  return new Promise(res => {
    if (p.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 3000);
    p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}

async function answer(sdp, ts) {
  try {
    if (pc) pc.close();
    clearInterval(timer);
    v.srcObject = null;
    big('Phone found – connecting…', 'wait');
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.ontrack = e => {
      v.srcObject = e.streams && e.streams[0] ? e.streams[0] : new MediaStream([e.track]);
      const p = v.play(); if (p && p.catch) p.catch(err => { big('Video blocked: ' + err.message, 'bad'); report('video blocked: ' + err.message); });
    };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'failed') { big('NO: could not connect to the phone', 'bad'); report('connection failed'); }
      else if (s === 'disconnected') big('Phone disconnected…', 'bad');
    };
    await pc.setRemoteDescription({ type: 'offer', sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    await setDoc(ref, { answer: pc.localDescription.sdp, answerTs: ts }, { merge: true });
    lastFrames = 0; lastAt = Date.now();
    timer = setInterval(check, 2000);
  } catch (e) {
    big('Error: ' + e.message, 'bad'); report('error: ' + e.message);
  }
}

async function check() {
  if (!pc) return;
  let frames = 0, path = '';
  const st = await pc.getStats(); const c = {}; let pair = null;
  st.forEach(r => {
    if (r.type === 'inbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) frames = r.framesDecoded || 0;
    if (r.type === 'candidate-pair' && (r.selected || r.nominated) && r.state === 'succeeded') pair = r;
    if (r.type === 'local-candidate' || r.type === 'remote-candidate') c[r.id] = r;
  });
  if (pair && c[pair.localCandidateId] && c[pair.remoteCandidateId]) {
    const l = c[pair.localCandidateId].candidateType, r = c[pair.remoteCandidateId].candidateType;
    path = (l === 'host' && r === 'host') ? 'direct over Wi-Fi' : l + ' → ' + r;
  }
  const now = Date.now(), fps = Math.round((frames - lastFrames) * 1000 / Math.max(1, now - lastAt));
  lastFrames = frames; lastAt = now;
  const playing = fps > 0 && v.videoWidth > 0 && !v.paused;
  if (playing) {
    big('YES: live video is playing', 'ok');
    report('YES: playing ' + v.videoWidth + 'x' + v.videoHeight + ' at about ' + fps + ' fps' + (path ? ', ' + path : ''));
  } else if (pc.connectionState === 'connected') {
    big('Connected, but no picture yet…', 'wait');
    if (frames === 0) report('connected but no video frames');
  }
  detail('State: ' + pc.connectionState + ' · ' + v.videoWidth + '×' + v.videoHeight + ' · ' + fps + ' fps' + (path ? ' · ' + path : ''));
}
</script>
</body>
</html>
